[package]
name = "escribass-tests"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Cross-cutting suites: determinism now, golden renders at M1"
publish = false

# No library and no `src/`: this package exists to hold suites and their inputs, and
# `autotests` off keeps cargo from looking for a `tests/tests/` directory.
autotests = false

[[test]]
name = "determinism"
path = "determinism.rs"

# `lock.baseline.json` against the files that really pin what it declares, both ways (M4 PR 8).
# Unconditional on purpose: it reads text files and spawns nothing, so there is no environment
# for it to need and no reason for a plain `cargo test` not to run it.
[[test]]
name = "baseline"
path = "baseline.rs"

# The golden renders, absent unless asked for. They need a built engine and three VST3s, which
# cargo cannot produce, and a `#[test]` that noticed that and returned early would be the quiet
# skip M0.4 exists to prevent (docs/plan.md, M1 PRs). `required-features` makes the target not
# exist without the feature, so `cargo test` from the root compiles it away and
# `cargo test -p escribass-tests --features renders` compiles it and then insists.
[[test]]
name = "renders"
path = "renders.rs"
required-features = ["renders"]

# The gRPC client the engine job's shell steps drive the engine with (M2 PR 9). It is `core`'s
# own `Engine` behind an argv, not a second implementation of the boundary — see the file.
[[bin]]
name = "render-once"
path = "render_once.rs"

[features]
renders = []
# The loop's end-to-end golden (M3 PR 8; ADR 0022 §4). A feature rather than a test that
# notices there is no `uv` and returns, for `renders`' reason: that would be the quiet skip
# M0.4 exists to prevent. With it, the suite spawns the real `ai` process and insists.
#
#     cd ai && uv sync --locked
#     cargo test -p escribass-tests --features ai
ai = []
# The `generators` script (M4 PR 5; ADR 0024 §8). A feature for `ai`'s reason one tier over:
# the suite tells `escribass-mcp` a `--generator`, and every compile in the script spawns a
# real Python child out of `compilers/generative/` — which needs `uv` and a synced
# environment that cargo cannot produce. A `#[test]` that noticed that and returned would be
# the quiet skip M0.4 exists to prevent; with the feature, the suite insists, and the
# staleness guard refuses an environment older than the lock it was built from (trap 5).
#
#     cd compilers/generative && uv sync --locked
#     cargo test -p escribass-tests --features generators
generators = []

# `escribass-core`, `escribass-proto` and `prost` are dependencies rather than dev-dependencies
# because `render-once` above links them, and a `[[bin]]` sees only the first list. Nothing
# else changes: a dev-dependency and a dependency are the same thing to `cargo test`.
[dependencies]
# `diff` builds the failure report, so a mismatch names paths rather than printing two
# documents. Nothing here reaches into `core` to mutate a song — that goes through the
# server binary, as CLAUDE.md #2 requires.
escribass-core = { path = "../core" }
# The generated client, so the same scripts can be driven over the other transport. Already
# pinned in lock.baseline.json under `tool_api`; this is a new consumer, not a new dependency.
escribass-proto = { path = "../proto" }
# Encoding the plan `render-once` is handed and the result it answers with. Already pinned
# under `schema.rust.prost`; a new consumer, not a new dependency.
prost = "0.14"

[dev-dependencies]
escribass-schema = { path = "../schema" }
tonic = "0.14.6"
tokio = { version = "1", features = ["rt", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
