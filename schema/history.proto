// Version control for the song model: the patch DAG of docs/adr/0001-song-history-as-patch-dag.md.
//
// This lives in its own package, and song.proto never imports it. History must never reach
// the render engine (§14.6), and separate packages make that structural rather than a rule
// somebody has to remember: a Song cannot carry a PatchEntry.

syntax = "proto3";

package escribass.history.v1;

import "google/protobuf/struct.proto";
import "song.proto";

// One RFC 6902 operation. Field names and types are chosen so that the proto3 JSON of this
// message *is* a valid RFC 6902 operation object, and PatchEntry.ops is therefore
// consumable by any off-the-shelf JSON Patch library without translation (ADR 0002 §11).
message Op {
  string op = 1; // "add" | "remove" | "replace" | "move" | "copy" | "test"
  string path = 2; // JSON Pointer
  optional string from = 3;
  google.protobuf.Value value = 4;
}

// One node in the history DAG. Append-only; entries are never rewritten or deleted.
message PatchEntry {
  string id = 1;
  // Empty at the root, one entry normally, two for a merge (ADR 0001 §1).
  repeated string parents = 2;
  // The tool call that produced these ops, e.g. "set_notes".
  string tool = 3;
  repeated Op ops = 4;
  escribass.song.v1.Provenance provenance = 5;
}

// The contents of refs.json: branch pointers and the current branch (ADR 0001 §2).
// HEAD always names a ref; there is no detached state.
message Refs {
  string head = 1;
  // Key: ref name. Value: PatchEntry id.
  map<string, string> refs = 2;
}
