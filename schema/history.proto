// Version control for the song model: the patch DAG of docs/adr/0001-song-history-as-patch-dag.md.
//
// This lives in its own package, and song.proto never imports it. History must never reach
// the render engine (§14.6), and separate packages make that structural rather than a rule
// somebody has to remember: a Song cannot carry a PatchEntry.
//
// Note what this file is NOT: the on-disk shape of patches/*.json. That file is a literal
// RFC 6902 document written by core's canonical writer (ADR 0001 §1). JSON Patch values are
// dynamically typed by nature, and modelling them in protobuf cost both determinism and
// round-tripping — see ADR 0002 §11. The messages here are the gRPC transport.

syntax = "proto3";

package escribass.history.v1;

import "song.proto";

// One node in the history DAG. Append-only; entries are never rewritten or deleted.
message PatchEntry {
  string id = 1;
  // Empty at the root, one entry normally, two for a merge (ADR 0001 §1).
  repeated string parents = 2;
  // The tool call that produced these ops, e.g. "set_notes".
  string tool = 3;
  // The canonical JSON text of the RFC 6902 operations array, verbatim as written to
  // patches/*.json. Opaque here on purpose: carrying it as bytes keeps the bytes on the
  // wire identical to the bytes on disk, and keeps protobuf out of the business of
  // representing arbitrary JSON values.
  bytes ops = 4;
  escribass.song.v1.Provenance provenance = 5;
  // Schema version the ops were authored against, so a replay from the root can tell when
  // it crosses a schema boundary.
  uint32 schema_version = 6;
}

// The contents of refs.json: branch pointers and the current branch (ADR 0001 §2).
// HEAD always names a ref; there is no detached state.
message Refs {
  string head = 1;
  // Key: ref name. Value: PatchEntry id.
  map<string, string> refs = 2;
}
