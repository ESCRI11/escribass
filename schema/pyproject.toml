[project]
name = "escribass-schema"
version = "0.1.0"
description = "Generated Pydantic models for the escribass song model"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["betterproto2[pydantic]==0.10.0"]

# `grpclib` is not this package's dependency in any honest sense: schema/*.proto declares no
# service, and nothing here imports it. It is `ai`'s runtime stack (ADR 0020 §2), pinned here
# because `proto/` has no Python environment of its own on purpose — it borrows this one for
# its codegen, the way it borrows schema's `tsc` and `protoc-gen-es` — and because the check
# that `proto/gen/python` imports at all has to run somewhere. A dev group is where a
# build-time-only package belongs, and nothing in this project ships. M3 PR 5 declares it
# again in `ai/pyproject.toml`, as `betterproto2[pydantic,grpclib]` plus the package; the one
# place that says which version both mean is `lock.baseline.json`'s `ai.grpclib`.
[dependency-groups]
dev = [
    "betterproto2-compiler==0.10.1",
    "grpclib==0.4.9",
]

# `ai/` depends on it, so the deferred row's trigger fired (docs/plan.md, "Deferred, on
# purpose"; schema/AGENTS.md, Consumers). Until M3 PR 5 the one consumer was this project's own
# tests, which put `gen/python` on `sys.path`; a sidecar that did the same in its `__init__`
# would carry the repository's layout inside the product, and an installer (M5) is where that
# stops being true. So the generated tree is a package now, and `ai/` depends on it by path the
# way `core` depends on the crate and `app` on the npm package.
#
# `uv_build` because `uv` is already what §17 pins for Python and the backend ships with it:
# nothing is added to the runtime, and the alternative backends are a package each for the same
# two lines of configuration. The module lives under `gen/`, which `codegen.sh` deletes whole on
# every run, so consumers install it **editable** — a built copy would be a second, stale
# `escribass_schema` the moment the protos changed, which is CLAUDE.md #1's failure by way of
# packaging.
[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "gen/python"
module-name = "escribass_schema"
