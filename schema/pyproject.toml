[project]
name = "escribass-schema"
version = "0.1.0"
description = "Generated Pydantic models for the escribass song model"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["betterproto2[pydantic]==0.10.0"]

[dependency-groups]
dev = ["betterproto2-compiler==0.10.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gen/python/escribass_schema"]
