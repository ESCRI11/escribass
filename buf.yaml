# Workspace root, not schema/: buf v2 wants one buf.yaml at the common ancestor of every
# module, and docs/specs.md §13 puts the gRPC service definitions (M0.3) in /proto, which
# import schema/song.proto. Adding that module is one line here.
version: v2
modules:
  - path: schema
lint:
  use:
    - STANDARD
  except:
    # docs/specs.md §13 fixes these files at schema/*.proto, not schema/escribass/song/v1/.
    # Both rules assume a directory tree mirroring package names; the spec names the flat
    # layout, and ADR 0002 §6 requires song and history to be separate packages.
    - PACKAGE_DIRECTORY_MATCH
    - DIRECTORY_SAME_PACKAGE
breaking:
  use:
    - FILE
