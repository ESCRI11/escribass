# Workspace root, not schema/: buf v2 wants one buf.yaml at the common ancestor of every
# module, and docs/specs.md §13 puts the gRPC service definitions (M0.3) in /proto, which
# import schema/song.proto. Adding that module is one line here.
version: v2
modules:
  - path: schema
  - path: proto
    lint:
      use:
        - STANDARD
      except:
        # As above: §13 fixes this file at proto/song_tools.proto, not
        # proto/escribass/tools/v1/.
        - PACKAGE_DIRECTORY_MATCH
        - DIRECTORY_SAME_PACKAGE
        # §5 names the service `SongTools`, and ADR 0006 §1 gives every mutating RPC one
        # shared `ToolResult`. STANDARD wants `SongToolsService`, a response message per RPC
        # named after it, and no response shared between two RPCs. All three contradict the
        # specified shape, and satisfying them means ~20 wrapper messages that exist only to
        # quiet a linter.
        - SERVICE_SUFFIX
        - RPC_RESPONSE_STANDARD_NAME
        - RPC_REQUEST_RESPONSE_UNIQUE
lint:
  use:
    - STANDARD
  except:
    # docs/specs.md §13 fixes these files at schema/*.proto, not schema/escribass/song/v1/.
    # Both rules assume a directory tree mirroring package names; the spec names the flat
    # layout, and ADR 0002 §6 requires song and history to be separate packages.
    - PACKAGE_DIRECTORY_MATCH
    - DIRECTORY_SAME_PACKAGE
breaking:
  use:
    - FILE
