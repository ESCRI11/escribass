# The four checks that CLAUDE.md requires before any milestone step is called done.
# Until this existed, they were a gate only when someone remembered to run them.
name: checks

on:
  push:
    branches: [main]
  pull_request:

# One run per ref at a time, and a superseded pull-request run is cancelled. Added in M1 PR 11,
# which took this workflow from two jobs to four and from "up to an hour" to that plus three
# render jobs: pushing twice in a minute otherwise leaves two full engine builds racing, both
# answering a question about a commit nobody is waiting on any more. A push to **main** is never
# cancelled — main is the last line of defence, and a build abandoned halfway there is a green
# tick nobody earned.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Four jobs with very different appetites: `checks` is a few minutes, `engine` compiles
# Tracktion Engine, JUCE and three VST3s and is up to an hour cold, and `renders` and
# `cross-cpu` (M1 PR 11) render the goldens on three runners with the binary `engine` built.
# Paying that for a typo in docs/specs.md is the wall-clock cost of the whole workflow spent on
# nothing, so each job below first asks whether the pull request touched anything it actually
# reads — the last two by asking `engine`, whose inputs are theirs.
#
# Three decisions, because a gate that gets any of them wrong is a silent hole — it does not
# fail, it just stops testing something and nobody notices until the thing it stopped testing
# breaks:
#
# 1. The gate is a shell step, not `paths:` on the trigger above and not a filter action.
#    `paths:` is workflow-wide, and this workflow is two jobs with two different sets of
#    inputs, so it cannot express the distinction at all. A third-party action (dorny/
#    paths-filter and friends) would be a dependency lock.baseline.json does not track, for
#    what two lines of `git diff` do; CLAUDE.md #4 wants every dependency pinned there, and
#    nothing here is worth opening that ledger or that supply chain.
#
# 2. The gate skips *steps*, never a job. A job skipped by `jobs.<id>.if` reports no status
#    at all, and a required status check that never reports leaves a pull request unmergeable
#    for good. This repository is private on a plan where the branch-protection API answers
#    403, so whether required checks are configured is not knowable from in here — and this
#    shape is correct either way: both jobs always run, always report, and simply do nothing
#    when there is nothing for them to do. No `changes` job and no trailing "all green" job
#    to keep in sync with the job list either.
#
# 3. The gate applies to pull requests only. A push to main is the last line of defence, and
#    it may be a squash, a merge commit or a direct push — no one base-ref convention covers
#    all three, and an engine build skipped on main because the diff looked small is a broken
#    main that no pull request is left to blame. main always builds everything.
#
# The lists below are exclusions, not inclusions: a path that is not named runs the job. A
# new top-level directory (§13 has /app, /ai and /compilers still to come) therefore triggers
# both jobs until someone deliberately decides otherwise, which is the direction that costs
# runner minutes instead of coverage. `.github/` is in neither list on purpose: a change to
# this gate is tested by this gate.

jobs:
  checks:
    runs-on: ubuntu-latest
    # The determinism suite drives server subprocesses over pipes and sockets. One that never
    # answers would otherwise hold a runner for GitHub's six-hour default and report nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking compares against a git ref

      # What this job reads is the cargo workspace in the root Cargo.toml — schema, proto,
      # core, tests — plus the protos, buf.yaml and the toolchain pins. What it does not read
      # is docs/, .githooks/, the root prose files, and engine/: the engine is C++ that no
      # workspace member depends on, and it consumes song.proto rather than being consumed
      # (CLAUDE.md #6). Everything else — lock.baseline.json, Cargo.lock, .github/ — is
      # deliberately absent from the list and so runs the job, because the failure mode here
      # is a Rust or codegen change merging untested, and that is worth far more than the
      # three minutes this job costs.
      #
      # The four sub-checks and `Wire compatibility` have different inputs, but they share the
      # setup above and below — three `cargo install`s, `npm ci`, `uv sync` — which is most of
      # the job's cost. Gating them apart would still pay all of it, so the whole job is one
      # gate.
      - name: Does this pull request touch anything these checks read?
        if: github.event_name == 'pull_request'
        run: |
          # HEAD is the merge commit GitHub builds for a pull request and HEAD^1 is the base
          # branch tip it was merged onto, so this is exactly the diff the pull request
          # introduces. If either is unavailable — a shallow clone, a pull request with no
          # merge ref — the job runs in full rather than guessing at what changed.
          base=$(git rev-parse --verify HEAD^1) || exit 0
          changed=$(git diff --name-only "$base" HEAD) || exit 0
          echo "$changed"
          [ -n "$changed" ] || exit 0
          if ! printf '%s\n' "$changed" | grep -qvE '^(docs/|engine/|\.githooks/|[^/]+\.md$)'; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "::notice::nothing these checks read has changed"
          fi

      # rustup reads rust-toolchain.toml, so the pinned 1.98.0 installs itself.
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: "25"

      - name: Install uv
        if: env.SKIP != '1'
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache codegen plugins
        if: env.SKIP != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: codegen-plugins-prost-0.5.0-serde-0.4.0-tonic-0.5.0

      - name: Install codegen plugins
        if: env.SKIP != '1'
        run: |
          command -v protoc-gen-prost       >/dev/null || cargo install protoc-gen-prost@0.5.0 --locked
          command -v protoc-gen-prost-serde >/dev/null || cargo install protoc-gen-prost-serde@0.4.0 --locked
          command -v protoc-gen-tonic       >/dev/null || cargo install protoc-gen-tonic@0.5.0 --locked

      - name: Install JavaScript and Python dependencies
        if: env.SKIP != '1'
        working-directory: schema
        run: |
          npm ci
          uv sync --locked

      # 1/4 — generated code matches the protos. Two modules, two scripts: the model
      # generates Rust, TypeScript and Python; the service generates Rust only (ADR 0006 §7).
      - name: Generated code is in sync
        if: env.SKIP != '1'
        run: |
          ./schema/codegen.sh --check
          ./proto/codegen.sh --check

      # 2/4
      - name: Rust
        if: env.SKIP != '1'
        run: cargo test

      # 3/4
      - name: TypeScript
        if: env.SKIP != '1'
        working-directory: schema
        run: |
          npx tsc --noEmit
          node --import tsx --test tests/*.test.ts

      # 4/4
      - name: Python
        if: env.SKIP != '1'
        working-directory: schema
        run: uv run python -m unittest discover -s tests

      # song.proto has consumers from M0.2; a field renumbered by accident is a silent
      # wire break. Only meaningful against a different ref, so pull requests only.
      - name: Wire compatibility
        if: env.SKIP != '1' && github.event_name == 'pull_request'
        run: |
          # actions/checkout leaves no local ref for the base branch on a pull_request event,
          # even at fetch-depth 0, so buf's `.git#branch=...` cannot resolve it. Fetch it into
          # a local ref first.
          git fetch --no-tags origin \
            "+refs/heads/${GITHUB_BASE_REF}:refs/heads/${GITHUB_BASE_REF}"
          schema/node_modules/.bin/buf breaking --against ".git#branch=${GITHUB_BASE_REF}"

  # The engine, its three bundled plugins and the manifest that says what this build can host
  # (ADR 0010 §4), on the image and compiler every M1 golden render is valid for (ADR 0009 §1,
  # §5). ubuntu-latest moves, and every golden would drift with no PR to blame; this job names
  # the image and the compiler.
  #
  # A runner has no display of any kind, so this job is also the standing answer to trap 10:
  # the scan step below instantiates all three VST3s and would fail here first.
  engine:
    runs-on: ubuntu-24.04
    # The gate below skips steps rather than the job (see the header), so the jobs that need
    # this one's build have to be told what it decided. A skipped *step* leaves this empty,
    # which is what a push to main gets, and everything downstream then runs.
    outputs:
      skipped: ${{ steps.gate.outputs.skip }}
    # Three plugins roughly triple what this job compiles; the cache below is what keeps it
    # from being the wall-clock cost of the whole workflow on every run.
    timeout-minutes: 60
    env:
      # The image carries three GCCs; g++ 13.3 is the pin (docs/specs.md §17).
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^1, for the path gate below. The default depth of 1 grafts the merge commit's
          # parents away, and the gate would then fail to resolve a base and rebuild the world
          # on every pull request.
          fetch-depth: 2

      # What this job reads is engine/ and its vendored trees, the pins in lock.baseline.json
      # and .gitmodules that decide which commits those trees sit at, schema/song.proto and
      # proto/render.proto (the C++ is generated from them at configure time), and tests/,
      # where the M1 golden renders this build has to reproduce live. What it does not read is
      # docs/, .githooks/, the root prose files, and core/: core is Rust and the engine is
      # schema-agnostic (CLAUDE.md #6), so no source path connects them.
      #
      # `core/` stays excluded even though the `renders` job below drives `core` into this
      # build, and that is ADR 0007 §4's split doing its job rather than an oversight: a `core`
      # change that would move a render moves the plan first, and the plan goldens are in the
      # `checks` job, which every `core/` change runs. A render mismatch with those green is the
      # engine's; a `core` change with those red never gets as far as asking. Rebuilding
      # Tracktion for an hour to learn what a plan diff already says is the trade this exclusion
      # is making.
      #
      # Everything else runs
      # the build, because the failure mode is a plugin or a pin silently no longer compiling
      # — the thing this job exists to catch — and an hour of runner time is the cheaper half
      # of that trade. `schema/` is not narrowed to song.proto: a rebuild triggered by a
      # Python test file is a few warm-ccache minutes, a missed one is a broken engine.
      - name: Does this pull request touch anything the engine is built from?
        id: gate
        if: github.event_name == 'pull_request'
        run: |
          # As in the `checks` job above: HEAD is the pull request's merge commit, HEAD^1 the
          # base it was merged onto, and anything unresolvable means build everything.
          base=$(git rev-parse --verify HEAD^1) || exit 0
          changed=$(git diff --name-only "$base" HEAD) || exit 0
          echo "$changed"
          [ -n "$changed" ] || exit 0
          if ! printf '%s\n' "$changed" | grep -qvE '^(docs/|core/|\.githooks/|[^/]+\.md$)'; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing the engine is built from has changed"
          fi

      # Tracktion declares JUCE with an SSH URL no keyless runner can clone, and `insteadOf`
      # did not take (spike, 2026-09-04): the submodule's own config is overridden before JUCE
      # is fetched. Depth 1 at the pinned commit, which GitHub serves for any reachable SHA.
      - name: Check out the submodules
        if: env.SKIP != '1'
        run: |
          git submodule update --init --depth 1 \
            engine/vendor/tracktion_engine engine/vendor/protobuf \
            engine/vendor/rubberband \
            engine/vendor/surge engine/vendor/sfizz-ui engine/vendor/dexed
          git -C engine/vendor/tracktion_engine config submodule.modules/juce.url https://github.com/juce-framework/JUCE.git
          git -C engine/vendor/tracktion_engine submodule update --init --depth 1 modules/juce
          # Each plugin vendors a dependency tree of its own — Surge and Dexed a JUCE each,
          # sfizz-ui the sfizz that lock.baseline.json pins, as its `library` submodule. Depth
          # 1 for the same reason as above: Surge's tree alone is about a gigabyte in full.
          for p in surge sfizz-ui dexed; do
            git -C "engine/vendor/$p" submodule update --init --recursive --depth 1 --jobs 4
          done

      # X11 headers are needed to build even headless: JUCE compiles juceaide against
      # juce_gui_basics during configure, before any define of ours applies. webkit2gtk and
      # gtk+ are not needed (spike, 2026-09-04). JUCE links X11 by dlopen, so the -dev
      # packages are for their headers.
      #
      # The plugins add two groups, both headers for libraries their code dlopens or their
      # editors draw with, neither of which a render touches: JACK, because Dexed compiles its
      # JUCE with JUCE_JACK=1 in its own CMakeLists; and xcb, xkbcommon, cairo and pango,
      # because sfizz-ui's VST3 links VSTGUI and VSTGUI's Linux backend is drawn on those.
      - name: Install build dependencies
        if: env.SKIP != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build ccache \
            libasound2-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libjack-jackd2-dev \
            libxcb1-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libglib2.0-dev

      # ccache rather than a cache of built plugin bundles, because ccache decides a hit from
      # the preprocessed source and the compile line: a moved pin misses it by construction
      # rather than by our bookkeeping being right, and a cache that served a stale plugin
      # binary would be trap 8 one layer out. The key names lock.baseline.json so that a pin
      # change also starts from a cache with nothing of the old pin to offer, and carries the
      # run id so each run saves what it learned (actions/cache keys are write-once).
      - name: Cache compiled objects
        if: env.SKIP != '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: engine-ccache-gcc13-${{ hashFiles('lock.baseline.json') }}-${{ github.run_id }}
          restore-keys: engine-ccache-gcc13-${{ hashFiles('lock.baseline.json') }}-

      - name: Configure
        if: env.SKIP != '1'
        run: |
          ccache --max-size=4G
          cmake -S engine -B engine/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Generates the C++ from schema/song.proto and proto/render.proto (ADR 0008 §4), checks
      # the compile commands of the engine and of each plugin for -ffast-math and a second
      # -march (ADR 0009 §3), compiles all four, and scans the three VST3s into the manifest.
      - name: Build
        if: env.SKIP != '1'
        run: |
          cmake --build engine/build --target manifest
          ccache --show-stats

      # The guard above only guards while it can see the thing it forbids. Its header claimed
      # to catch "code compiled for a wider ISA than the pin" and its regex matched `-march=`
      # alone, so `-mavx2` on a bumped Dexed or Surge XT would have passed in silence — and
      # their CPU independence is what makes their goldens portable (§8). Doctoring a real
      # compile database is how that stays true: the check has to fail on this file, and the
      # four real ones above have to pass, and neither is evidence for the other (M1 PR 13).
      - name: The flag check catches a wider ISA, not just a wider -march
        if: env.SKIP != '1'
        run: |
          sed 's/-march=x86-64/-march=x86-64 -mavx2/' \
            engine/build/plugins/dexed/compile_commands.json > doctored.json
          if cmake -DCOMPILE_COMMANDS=$PWD/doctored.json -P engine/cmake/check_flags.cmake; then
            echo "::error::check_flags.cmake passed a compile line carrying -mavx2"
            exit 1
          fi

      # ADR 0008 §5 and §17: the binary reports the commits it was compiled from, and they are
      # the ones lock.baseline.json pins. A drifted submodule fails here, naming the component.
      - name: Built from the pinned commits
        if: env.SKIP != '1'
        run: |
          engine=engine/build/escribass_engine_artefacts/Release/escribass_engine
          "$engine" --version
          check() {
            built=$("$engine" --version | awk -v c="$1" '$1 == c { print $2 }')
            if [ "$2" != "$built" ]; then
              echo "::error::$1: built from ${built}, lock.baseline.json pins $2"
              exit 1
            fi
          }
          for component in tracktion_engine juce protobuf rubberband; do
            check "$component" "$(jq -r ".engine.${component}.commit" lock.baseline.json)"
          done
          for component in surge_xt sfizz_ui dexed; do
            check "$component" "$(jq -r ".bundled_plugins.${component}.commit" lock.baseline.json)"
          done
          # Failure is an exit code (ADR 0008 §1): nothing on stdin is not a plan.
          if "$engine" engine/build/manifest.json < /dev/null > /dev/null; then
            echo "::error::the engine accepted an empty stdin as a plan"
            exit 1
          fi

      # What this build can host, as the plugins themselves reported it (ADR 0010 §4). PR 9
      # wires core's validator to this; here it is only asserted to exist and to be complete,
      # so that a plugin that builds but declares nothing fails in the PR that broke it.
      - name: The manifest describes what this build can host
        if: env.SKIP != '1'
        run: |
          manifest=engine/build/manifest.json
          jq '.plugins | to_entries | map({key, version: .value.version, params: (.value.params | length)})' "$manifest"
          # Four entries from three files: sfizz-ui's VST3 declares both `sfizz` and
          # `sfizz-multi`, and a manifest describes classes this build can host, not files.
          jq -e '(.plugins | length) == 4' "$manifest" > /dev/null
          jq -e 'all(.plugins[]; (.params | length) > 0 and (.commit | length) == 40)' "$manifest" > /dev/null
          for component in surge_xt sfizz_ui dexed; do
            commit=$(jq -r ".bundled_plugins.${component}.commit" lock.baseline.json)
            jq -e --arg c "$commit" 'any(.plugins[]; .commit == $c)' "$manifest" > /dev/null \
              || { echo "::error::the manifest names no plugin built from ${component} ${commit}"; exit 1; }
          done

      # The other half of ADR 0010 §4, and the reason the fixture is allowed to be committed
      # at all. `core`'s tests and the determinism suite validate against
      # tests/fixtures/manifest.json — a hand-trimmed subset of a real `--scan`, because the
      # real one is generated at build time and never committed. A subset that stops being a
      # subset is a fixture drifting back into invented ids, which is exactly the defect PR 9
      # replaced, and this is the only place both files exist at once.
      - name: The manifest fixture is a subset of what this build declares
        if: env.SKIP != '1'
        run: |
          jq -e --slurpfile built engine/build/manifest.json '
            .engine == ($built[0].engine)
            and .sampler == ($built[0].sampler)
            and (.plugins | to_entries | all(
              ($built[0].plugins[.key]) as $b
              | $b != null
                and $b.commit == .value.commit
                and $b.version == .value.version
                and (.value.params | to_entries | all($b.params[.key] == .value))))
          ' tests/fixtures/manifest.json > /dev/null \
            || { echo "::error::tests/fixtures/manifest.json is no longer a subset of what this build declares"; exit 1; }

      # A note through a real plugin, twice, in two fresh processes. This is not the golden
      # render suite — that is the `renders` job below, with committed WAVs and a
      # first-differing-sample report — it is the standing answer to "does hosting still work at
      # all", which nothing else in this workflow asks. Dexed because it is pure FM with no RNG
      # and no resampling (docs/specs.md §8), so a difference here is the engine's, not a
      # plugin's.
      #
      # The two runs share one output path, and until M1 PR 11 that made this comparison and the
      # three below it **vacuous**: Tracktion opened the destination at end-of-file, so the
      # second render appended a whole second RIFF file and every reader — this one included —
      # took the first `data` chunk, which was the first run's. The engine now removes the
      # destination first (`engine/src/main.cpp`), which is what makes rendering twice to one
      # path a real question again. `tests/renders.rs` gives every render a path of its own as
      # well, so it would catch a regression here rather than inherit it.
      #
      # The plan is written as protobuf text and encoded by the protoc this build already
      # produced, so the check adds no tool and no dependency. The comparison is the engine's
      # own pcm_sha256, which is a hash of the `data` chunk: the files differ every run,
      # because JUCE writes the clock into a `bext` chunk (ADR 0009 §2).
      - name: A note sounds, and it sounds the same twice
        if: env.SKIP != '1'
        run: |
          engine=engine/build/escribass_engine_artefacts/Release/escribass_engine
          protoc=engine/build/vendor/protobuf/protoc
          cat > plan.txtpb <<EOF
          tracks {
            instrument { instrument { ref { plugin { plugin_id: "Digital Suburban/Dexed" } } } }
            mix { gain_db: 0.0 pan: 0.0 }
            clips { start_tick: 0 length_ticks: 1920
                    notes { notes { pitch: 60 start_tick: 0 length_ticks: 960 velocity: 100 } } }
          }
          master { mix { gain_db: 0.0 pan: 0.0 } }
          tempo { tick: 0 bpm: 120.0 }
          target { kind: RENDER_KIND_MASTER sample_rate: 48000 bit_depth: 24 }
          length_ticks: 1920
          output_path: "$PWD/note.wav"
          EOF
          "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
            --encode=escribass.render.v1.RenderPlan proto/render.proto < plan.txtpb > plan.binpb
          hash_of() {
            "$engine" engine/build/manifest.json < plan.binpb > "$1"
            "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
              --decode=escribass.render.v1.RenderResult proto/render.proto < "$1" \
              | sed -n 's/^pcm_sha256: "\(.*\)"$/\1/p'
          }
          one=$(hash_of one.binpb)
          # 1920 ticks at 120 bpm is one second: 48000 frames of 24-bit stereo in `data`.
          python3 - <<'PY'
          import struct, sys, wave
          w = wave.open("note.wav")
          assert (w.getnchannels(), w.getframerate(), w.getsampwidth(), w.getnframes()) \
                 == (2, 48000, 3, 48000), (w.getnchannels(), w.getframerate(), w.getsampwidth(), w.getnframes())
          d = w.readframes(w.getnframes())
          peak = max(abs(int.from_bytes(d[i:i+3], "little", signed=True)) for i in range(0, len(d), 3))
          # A plugin that loaded and was never given the note renders silence and says nothing,
          # which is the failure this whole step exists to catch.
          assert peak > 8388608 // 100, f"the render peaks at {peak}; a hosted note is not silent"
          print(f"peak {peak} of {2**23}")
          PY
          two=$(hash_of two.binpb)
          echo "run 1 $one"
          echo "run 2 $two"
          [ -n "$one" ] && [ "$one" = "$two" ] \
            || { echo "::error::two renders of one plan disagree: $one vs $two"; exit 1; }

      # An asset plays, at its gain, with its fades, and stretched to fill its clip (PR 8).
      # Like the step above this is not the golden suite — it is the standing answer to "does
      # asset playback still work at all", which nothing else in this workflow asks, and PR 11
      # is three PRs away.
      #
      # The fixture is generated here rather than committed, because a committed asset belongs
      # to the golden suite and its `assets/` comparison (trap 16), and this step needs a
      # signal whose envelope can be checked rather than a recording. A constant is that
      # signal: the rendered sample at index n is then exactly the formula ADR 0011 §2 states,
      # with nothing of the asset's own shape in the way.
      - name: An asset plays, at its gain and with its fades
        if: env.SKIP != '1'
        run: |
          engine=engine/build/escribass_engine_artefacts/Release/escribass_engine
          protoc=engine/build/vendor/protobuf/protoc
          python3 - <<'PY'
          import struct, wave
          # One second of constant 0.5 at 48 kHz, mono, 24-bit — the render's own rate, so
          # nothing resamples and the envelope is the only thing under test.
          w = wave.open("dc.wav", "wb")
          w.setnchannels(1); w.setsampwidth(3); w.setframerate(48000); w.setnframes(48000)
          w.writeframes(struct.pack("<i", round(0.5 * 8388607))[:3] * 48000)
          w.close()
          PY
          # 1920 ticks at 120 bpm is one second. -6.0206 dB is exactly half in amplitude; the
          # fades are 960 and 480 ticks, so 24000 and 12000 samples, and they overlap for the
          # middle of the clip at neither ramp's full value — which is the case ADR 0011 §2
          # needs no rule for.
          cat > audio.txtpb <<EOF
          tracks {
            mix { gain_db: 0.0 pan: 0.0 }
            clips { start_tick: 0 length_ticks: 1920
                    audio { clip { asset_hash: "fixture" gain_db: -6.0206 fade_in_ticks: 960
                                   fade_out_ticks: 480 }
                            path: "$PWD/dc.wav" } }
          }
          master { mix { gain_db: 0.0 pan: 0.0 } }
          tempo { tick: 0 bpm: 120.0 }
          target { kind: RENDER_KIND_MASTER sample_rate: 48000 bit_depth: 24 }
          length_ticks: 1920
          output_path: "$PWD/audio.wav"
          EOF
          "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
            --encode=escribass.render.v1.RenderPlan proto/render.proto < audio.txtpb > audio.binpb
          hash_of() {
            "$engine" engine/build/manifest.json < audio.binpb > "$1"
            "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
              --decode=escribass.render.v1.RenderResult proto/render.proto < "$1" \
              | sed -n 's/^pcm_sha256: "\(.*\)"$/\1/p'
          }
          one=$(hash_of audio1.binpb)
          python3 - <<'PY'
          import wave
          w = wave.open("audio.wav")
          assert (w.getnchannels(), w.getframerate(), w.getsampwidth(), w.getnframes()) \
                 == (2, 48000, 3, 48000), w.getparams()
          d = w.readframes(w.getnframes())
          s = [int.from_bytes(d[i:i+3], "little", signed=True) / 8388608.0 for i in range(0, len(d), 3)]
          N, FIN, FOUT, GAIN, DC = 48000, 24000, 12000, 10 ** (-6.0206 / 20.0), 0.5
          # Tracktion reads every wave clip through a juce::LagrangeInterpolator even at a 1:1
          # ratio and does not compensate its 2-sample base latency, so the clip's own sample n
          # lands at n + 2 (docs/specs.md §8, sample-rate conversion).
          worst = max(
              abs(s[n * 2 + c] - (0.0 if n < 2 else
                                  DC * GAIN * min(1.0, (n - 2) / FIN) * min(1.0, (N - (n - 2)) / FOUT)))
              for n in range(N) for c in (0, 1))
          print(f"worst deviation from ADR 0011 §2's formula: {worst:.9f} ({worst * 8388608:.2f} LSB)")
          # Two LSB of 24-bit. Anything larger is a different envelope, not a rounding.
          assert worst < 2 / 8388608, f"the rendered envelope is not the formula's: {worst}"
          assert s[0] == 0.0 and s[2] == 0.0, "a fade-in does not start at silence"
          PY
          two=$(hash_of audio2.binpb)
          echo "run 1 $one"
          echo "run 2 $two"
          [ -n "$one" ] && [ "$one" = "$two" ] \
            || { echo "::error::two renders of one audio clip disagree: $one vs $two"; exit 1; }

      # M1 PR 13. Five defects a four-lane review of M1 found, every one of them behind a green
      # check and every one of them exiting 0 — which is why none of them was a golden failure
      # and why they are asserted here rather than left to the render suite. Each block names
      # the measurement that reproduced it.
      - name: A crowded, killed, oversized or nonsense render fails instead of lying
        if: env.SKIP != '1'
        run: |
          engine=engine/build/escribass_engine_artefacts/Release/escribass_engine
          protoc=engine/build/vendor/protobuf/protoc
          encode() {
            "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
              --encode=escribass.render.v1.RenderPlan proto/render.proto
          }
          hash_of() {
            "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
              --decode=escribass.render.v1.RenderResult proto/render.proto \
              | sed -n 's/^pcm_sha256: "\(.*\)"$/\1/p'
          }
          python3 - <<'PY'
          import struct, wave
          # The clip's own asset: a quarter-second of constant 0.5 at the render's rate, so
          # nothing resamples. And a decoy of a different length and level, to stand in the
          # scratch directory as a previous run's leftover.
          for name, frames, level in (("guard.wav", 12000, 0.5), ("decoy.wav", 24000, -0.25)):
              w = wave.open(name, "wb")
              w.setnchannels(1); w.setsampwidth(3); w.setframerate(48000); w.setnframes(frames)
              w.writeframes(struct.pack("<i", round(level * 8388607))[:3] * frames)
              w.close()
          PY
          plan() {
            cat <<EOF
          tracks {
            mix { gain_db: 0.0 pan: 0.0 }
            clips { start_tick: 480 length_ticks: ${2:-480}
                    audio { clip { gain_db: ${3:-0.0} } path: "$PWD/guard.wav" } }
          }
          master { mix { gain_db: 0.0 pan: 0.0 } }
          tempo { tick: 0 bpm: 120.0 }
          target { kind: RENDER_KIND_MASTER sample_rate: 48000 bit_depth: 24 }
          length_ticks: ${4:-1920}
          output_path: "$PWD/$1"
          EOF
          }
          refuses() {
            what="$1"; shift
            plan refused.wav "$@" | encode > refused.binpb
            if "$engine" engine/build/manifest.json < refused.binpb > /dev/null 2> refused.err; then
              echo "::error::the engine accepted $what"
              exit 1
            fi
            sed -n 's/^escribass_engine: /  refused: /p' refused.err
          }

          # A plan carrying a value that is not a number. `normalised()` gated every parameter
          # through `juce::jlimit`, which returns its argument when both comparisons are false,
          # so NaN went through it untouched; `gain_db` is read elsewhere entirely and had no
          # gate at all. Measured: NaN, inf and 1e9 dB each rendered the clip as pure silence,
          # exit 0, with a hash identical to an empty plan's.
          refuses "a NaN gain_db" 480 nan
          refuses "an infinite gain_db" 480 inf
          # Finite, and still not a finite gain: 10^(1e9/20) is inf.
          refuses "a gain_db of 1e9" 480 1e9
          # An int32 tick count that no longer fits an int number of sample frames. The clip's
          # frame count used to be a bare `(int)` cast of an int64: 1073741824 ticks at 120 bpm
          # and 48 kHz is 26,843,545,600 samples, which wraps to a positive 1,073,741,824, past
          # the `<= 0` guard and into an 8.6 GB AudioBuffer.
          refuses "a clip of 2^30 ticks" 1073741824 0.0
          refuses "a plan of 2^31-1 ticks" 480 0.0 2147483647

          # A scratch directory a previous run left behind. It was `escribass_engine.<pid>` in
          # the system temp directory, deleted only from a destructor — so it leaked every time
          # a render was killed, and pid reuse then walked into it. `createOutputStream` opens
          # an existing file at its end rather than truncating, so the clip was appended after
          # the leftover and `createReaderFor` took the stale payload in front: one plan, three
          # hashes, exit 0 and stderr empty each time. `$$` in the shell below is the pid the
          # `exec`d engine inherits, which is what makes this the real collision and not a
          # simulation of one.
          plan rendered.wav | encode > guard.binpb
          clean=$("$engine" engine/build/manifest.json < guard.binpb 2>/dev/null | hash_of)
          mkdir -p crowded
          dirty=$(TMPDIR=$PWD/crowded sh -c '
            mkdir -p "$TMPDIR/escribass_engine.$$" \
              && cp decoy.wav "$TMPDIR/escribass_engine.$$/clip1.wav" \
              && exec "$0" engine/build/manifest.json < guard.binpb' "$engine" 2>/dev/null | hash_of)
          echo "clean scratch $clean"
          echo "crowded       $dirty"
          [ -n "$clean" ] && [ "$clean" = "$dirty" ] \
            || { echo "::error::a leftover scratch file changed the render: $clean vs $dirty"; exit 1; }

          # A render killed halfway must not have destroyed the last good one. The destination
          # used to be deleted up front and written in place, so a SIGKILL left a truncated WAV
          # — measured at 43 MB, its `data` chunk declaring more than the file held — exactly
          # where the previous render had been, with the engine never reaching its own length
          # check to say so. It now renders to a sibling `.part` and renames only after every
          # check passes.
          plan keep.wav | encode > keep.binpb
          plan keep.wav 480 0.0 2880000 | encode > keeplong.binpb
          "$engine" engine/build/manifest.json < keep.binpb > /dev/null 2>/dev/null
          before=$(sha256sum keep.wav | cut -d' ' -f1)
          "$engine" engine/build/manifest.json < keeplong.binpb > /dev/null 2>/dev/null &
          victim=$!
          sleep 2
          kill -9 $victim || true
          wait $victim 2>/dev/null || true
          after=$(sha256sum keep.wav | cut -d' ' -f1)
          echo "before the kill $before"
          echo "after  the kill $after"
          [ "$before" = "$after" ] \
            || { echo "::error::a killed render replaced the previous one with a fragment"; exit 1; }
          rm -f keep.wav.part

          # A stdout it could not write. The RenderResult fits std::cout's buffer, so
          # SerializeToOstream returned true having written nothing to the descriptor and the
          # real write(2) happened inside the unchecked flush(): `> /dev/full` was exit 0 with
          # an empty stdout and nothing on stderr.
          if "$engine" engine/build/manifest.json < guard.binpb > /dev/full 2>/dev/null; then
            echo "::error::the engine exited 0 after a stdout it could not write"
            exit 1
          fi

      # The other half of PR 8: Rubber Band. A one-second asset in a two-second clip has to
      # come out two seconds long with its pitch unchanged, and it has to do it the same way
      # twice — a phase vocoder is the surface ADR 0009 §4 says is most at the mercy of its own
      # configuration.
      - name: A stretched clip fills its clip, keeps its pitch, and does it twice
        if: env.SKIP != '1'
        run: |
          engine=engine/build/escribass_engine_artefacts/Release/escribass_engine
          protoc=engine/build/vendor/protobuf/protoc
          python3 - <<'PY'
          import math, struct, wave
          # 441 Hz for one second: a whole number of cycles at 48 kHz, so the pitch check is
          # not measuring a truncated one.
          w = wave.open("tone.wav", "wb")
          w.setnchannels(1); w.setsampwidth(3); w.setframerate(48000); w.setnframes(48000)
          w.writeframes(b"".join(
              struct.pack("<i", round(0.5 * math.sin(2 * math.pi * 441 * n / 48000) * 8388607))[:3]
              for n in range(48000)))
          w.close()
          PY
          cat > stretch.txtpb <<EOF
          tracks {
            mix { gain_db: 0.0 pan: 0.0 }
            clips { start_tick: 0 length_ticks: 3840
                    audio { clip { asset_hash: "fixture" time_stretch: true }
                            path: "$PWD/tone.wav" } }
          }
          master { mix { gain_db: 0.0 pan: 0.0 } }
          tempo { tick: 0 bpm: 120.0 }
          target { kind: RENDER_KIND_MASTER sample_rate: 48000 bit_depth: 24 }
          length_ticks: 3840
          output_path: "$PWD/stretch.wav"
          EOF
          "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
            --encode=escribass.render.v1.RenderPlan proto/render.proto < stretch.txtpb > stretch.binpb
          hash_of() {
            "$engine" engine/build/manifest.json < stretch.binpb > "$1"
            "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
              --decode=escribass.render.v1.RenderResult proto/render.proto < "$1" \
              | sed -n 's/^pcm_sha256: "\(.*\)"$/\1/p'
          }
          one=$(hash_of stretch1.binpb)
          python3 - <<'PY'
          import wave
          w = wave.open("stretch.wav")
          assert (w.getnchannels(), w.getframerate(), w.getnframes()) == (2, 48000, 96000), w.getparams()
          d = w.readframes(w.getnframes())
          s = [int.from_bytes(d[i:i+3], "little", signed=True) / 8388608.0 for i in range(0, len(d), 3)][0::2]
          # An unstretched clip would run out after one second and leave the rest silent; this
          # is the assertion that the stretch happened at all.
          last = max(i for i, v in enumerate(s) if abs(v) > 1e-4)
          assert last > 95000, f"the stretched clip goes quiet at frame {last} of 96000"
          # Pitch, by zero crossings over the middle half. Rubber Band changes the duration and
          # not the frequency; a resample would have halved it to 220.5 Hz.
          mid = s[24000:72000]
          crossings = sum(1 for i in range(1, len(mid)) if (mid[i-1] < 0) != (mid[i] < 0))
          hz = crossings * 48000 / (2.0 * len(mid))
          print(f"stretched to frame {last}, pitch {hz:.1f} Hz")
          assert abs(hz - 441.0) < 5.0, f"the stretch moved the pitch to {hz} Hz"
          PY
          two=$(hash_of stretch2.binpb)
          echo "run 1 $one"
          echo "run 2 $two"
          [ -n "$one" ] && [ "$one" = "$two" ] \
            || { echo "::error::two stretched renders disagree: $one vs $two"; exit 1; }

      # The sampler (PR 8b): an SFZ from a content-addressed store, played by sfizz. The
      # fixture is what the answer to "an SFZ is not self-contained" looks like on disk — a
      # directory of files named by their own SHA-256, and an SFZ in it whose `sample=` is the
      # hash of the WAV beside it. sfizz resolves a sample against the directory the SFZ came
      # from, so that name and no other reaches anything.
      #
      # The pitch check is what makes this more than "something sounded": the asset is 441 Hz
      # and `pitch_keycenter` matches the note, so the tone coming out at 441 Hz is sfizz
      # having found, read and played that file. A dropped region — which is what an SFZ whose
      # sample cannot be resolved gets, silently (docs/specs.md §8) — is silence, and a sfizz
      # with no instrument at all is its own default sine at 440.
      - name: A sampler plays the SFZ it was given
        if: env.SKIP != '1'
        run: |
          engine=engine/build/escribass_engine_artefacts/Release/escribass_engine
          protoc=engine/build/vendor/protobuf/protoc
          python3 - <<'PY'
          import hashlib, io, math, pathlib, struct, wave
          buf = io.BytesIO()
          w = wave.open(buf, "wb")
          w.setnchannels(1); w.setsampwidth(3); w.setframerate(48000); w.setnframes(48000)
          w.writeframes(b"".join(
              struct.pack("<i", round(0.5 * math.sin(2 * math.pi * 441 * n / 48000) * 8388607))[:3]
              for n in range(48000)))
          w.close()
          wav = buf.getvalue()
          assets = pathlib.Path("assets"); assets.mkdir(exist_ok=True)
          name = hashlib.sha256(wav).hexdigest()
          (assets / name).write_bytes(wav)
          # 69 is A4, and the sample is 441 Hz, so the note is played untransposed.
          sfz = ("<region>\nsample=%s\npitch_keycenter=69 loop_mode=one_shot\n" % name).encode()
          (assets / hashlib.sha256(sfz).hexdigest()).write_bytes(sfz)
          pathlib.Path("sfz.hash").write_text(hashlib.sha256(sfz).hexdigest())
          PY
          hash=$(cat sfz.hash)
          cat > sampler.txtpb <<EOF
          tracks {
            instrument { instrument { ref { sampler { sfz_hash: "$hash" } } }
                         sfz_path: "$PWD/assets/$hash" }
            mix { gain_db: 0.0 pan: 0.0 }
            clips { start_tick: 0 length_ticks: 1920
                    notes { notes { pitch: 69 start_tick: 0 length_ticks: 960 velocity: 100 } } }
          }
          master { mix { gain_db: 0.0 pan: 0.0 } }
          tempo { tick: 0 bpm: 120.0 }
          target { kind: RENDER_KIND_MASTER sample_rate: 48000 bit_depth: 24 }
          length_ticks: 1920
          output_path: "$PWD/sampler.wav"
          EOF
          "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
            --encode=escribass.render.v1.RenderPlan proto/render.proto < sampler.txtpb > sampler.binpb
          hash_of() {
            "$engine" engine/build/manifest.json < sampler.binpb > "$1"
            "$protoc" -I schema -I proto -I engine/vendor/protobuf/src \
              --decode=escribass.render.v1.RenderResult proto/render.proto < "$1" \
              | sed -n 's/^pcm_sha256: "\(.*\)"$/\1/p'
          }
          one=$(hash_of sampler1.binpb)
          python3 - <<'PY'
          import wave
          w = wave.open("sampler.wav")
          assert (w.getnchannels(), w.getframerate(), w.getnframes()) == (2, 48000, 48000), w.getparams()
          d = w.readframes(w.getnframes())
          s = [int.from_bytes(d[i:i+3], "little", signed=True) / 8388608.0 for i in range(0, len(d), 3)][0::2]
          peak = max(abs(v) for v in s)
          assert peak > 0.01, f"the sampler peaks at {peak}; a region sfizz dropped is silence"
          mid = s[4000:44000]
          crossings = sum(1 for i in range(1, len(mid)) if (mid[i-1] < 0) != (mid[i] < 0))
          hz = crossings * 48000 / (2.0 * len(mid))
          print(f"peak {peak:.3f}, pitch {hz:.1f} Hz")
          # 441 is the asset. 440 would be sfizz's own default patch, which is a sine and not
          # this file, and is exactly the failure a loaded-nothing sampler looks like.
          assert abs(hz - 441.0) < 0.5, f"the sampler is playing {hz} Hz, not the asset's 441"
          PY
          two=$(hash_of sampler2.binpb)
          echo "run 1 $one"
          echo "run 2 $two"
          [ -n "$one" ] && [ "$one" = "$two" ] \
            || { echo "::error::two sampler renders disagree: $one vs $two"; exit 1; }

      # What the two jobs below render with: this engine binary, these plugin binaries, this
      # manifest. Uploaded rather than rebuilt, because ADR 0009 §6's question is whether *the
      # same binary* hashes the same on two CPUs — a second build would answer a different one,
      # and would also cost another hour.
      #
      # The manifest holds absolute plugin paths (ADR 0010 §4), and every runner unpacks the
      # workspace at the same `/home/runner/work/<repo>/<repo>`, so restoring this into
      # `engine/build` puts the plugins back where the manifest says they are. The jobs below
      # check that rather than assume it.
      - name: The engine, for the runners that will render with it
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: engine-build
          # `actions/upload-artifact` drops the executable bit, so the jobs below put it back.
          path: |
            engine/build/escribass_engine_artefacts/Release/escribass_engine
            engine/build/manifest.json
            engine/build/plugins/**/*.vst3/**
          retention-days: 1
          if-no-files-found: error

  # The golden renders (ADR 0009; `tests/renders.rs`), and ADR 0009 §6's experiment.
  #
  # §6 asks one question this repository could not answer from one machine: does the same engine
  # binary and the same plan produce the same PCM on two runner CPUs of the same architecture?
  # sfizz and JUCE choose their SIMD at run time, so an AVX2 runner and an SSE4 runner could
  # round differently, and the compile-time `-march` pin does nothing about it.
  #
  # The shape of the answer is the goldens themselves. Every one of these jobs renders the same
  # four fixtures and compares them, with no tolerance, against the same committed bytes — so
  # three runners agreeing *is* three runners producing identical PCM, and any one of them
  # disagreeing fails here with the first differing sample rather than as a summary. What the
  # matrix adds over one job is the chance of drawing two different CPU models from GitHub's
  # pool, which is not something a workflow can ask for; `cross-cpu` below reports which models
  # actually turned up, because "they agreed" is only evidence if they were different machines.
  renders:
    needs: engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      # Every runner reports, including when one of them is the one that disagrees.
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      # Evidence, not an assertion. The comparison above is over committed bytes either way;
      # this is what says whether two of these jobs were different hardware.
      - name: Which CPU did this runner get?
        id: cpu
        if: needs.engine.outputs.skipped != '1'
        run: |
          model=$(sed -n 's/^model name[[:space:]]*: //p' /proc/cpuinfo | head -1)
          # A blank model is a failure of this step, not a data point. Left to travel, it
          # reaches the cross-cpu job as a distinct first line and makes the count 2 — which is
          # the one positive claim that job exists to make, emitted from the absence of an
          # answer (M1 PR 13).
          if [ -z "$model" ]; then
            echo "::error::/proc/cpuinfo declares no model name on this runner, so ADR 0009 §6 has nothing to compare"
            exit 1
          fi
          flags=$(grep -m1 '^flags' /proc/cpuinfo | grep -o '\bavx512f\|\bavx2\|\bavx\|\bsse4_2' | sort -u | tr '\n' ' ')
          echo "$model"
          echo "SIMD the runtime dispatchers can pick from: $flags"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: The engine that was built, not one built here
        if: needs.engine.outputs.skipped != '1'
        uses: actions/download-artifact@v4
        with:
          name: engine-build
          path: engine/build

      # The libraries the plugins link or dlopen. This is the engine job's build list rather
      # than a runtime subset of it: the -dev packages pull in exactly the runtime ones, and one
      # list that is known to be sufficient beats two that have to be kept in agreement.
      - name: The libraries the plugins load
        if: needs.engine.outputs.skipped != '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfreetype-dev libfontconfig1-dev libcurl4-openssl-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libjack-jackd2-dev \
            libxcb1-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libcairo2-dev libpango1.0-dev libglib2.0-dev

      - name: The build arrived intact
        if: needs.engine.outputs.skipped != '1'
        run: |
          engine=engine/build/escribass_engine_artefacts/Release/escribass_engine
          chmod +x "$engine"
          find engine/build/plugins -name '*.so' -exec chmod +x {} +
          "$engine" --version
          # The manifest names absolute paths. If a runner ever unpacks the workspace somewhere
          # else, that is the failure to report — not `plugin_unknown` three layers up.
          python3 - <<'PY'
          import json, pathlib, sys
          plugins = json.loads(pathlib.Path("engine/build/manifest.json").read_text())["plugins"]
          missing = [p["path"] for p in plugins.values() if not pathlib.Path(p["path"]).exists()]
          if missing:
              sys.exit("::error::the manifest names plugins this runner does not have: %s" % missing)
          print(f"{len(plugins)} plugin classes, all where the manifest says")
          PY

      # `cargo test -p escribass-tests` cannot build the binaries it drives — cargo holds the
      # build lock while tests run — so they are built first, which is what `cargo test` from
      # the root does for the determinism suite.
      - name: Golden renders
        if: needs.engine.outputs.skipped != '1'
        run: |
          cargo build --bins
          cargo test -p escribass-tests --features renders -- --nocapture

      - name: What this runner rendered
        if: needs.engine.outputs.skipped != '1'
        run: |
          mkdir -p report
          {
            echo "${{ steps.cpu.outputs.model }}"
            for hash in tests/renders/*/golden.wav.sha256; do
              echo "$(basename "$(dirname "$hash")") $(cat "$hash")"
            done
          } > "report/runner-${{ matrix.runner }}.txt"
          cat "report/runner-${{ matrix.runner }}.txt"

      - name: Keep it for the comparison
        if: needs.engine.outputs.skipped != '1'
        uses: actions/upload-artifact@v4
        with:
          name: render-report-${{ matrix.runner }}
          path: report/
          retention-days: 1

  # ADR 0009 §6's experiment, reported rather than asserted.
  #
  # The agreement is already enforced: each `renders` job compared its own PCM against the same
  # committed goldens with no tolerance, so reaching here at all means every runner produced
  # identical bytes. What is left to say is *whether the runners were different CPUs*, which
  # nothing can request from GitHub and which decides whether the agreement is evidence for §6's
  # broader claim or just three draws of the same machine. One model across the matrix is
  # **inconclusive**, and says so — it is not a failure, because the runner pool is not ours to
  # choose, and calling it a pass would be the quiet skip this repository keeps refusing.
  cross-cpu:
    needs: [engine, renders]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every runner's CPU and every hash it reproduced
        if: needs.engine.outputs.skipped != '1'
        uses: actions/download-artifact@v4
        with:
          pattern: render-report-*
          merge-multiple: true
          path: report

      - name: Were they different CPUs?
        if: needs.engine.outputs.skipped != '1'
        run: |
          for file in report/*.txt; do
            echo "--- $(basename "$file" .txt)"
            cat "$file"
          done
          # Blank lines dropped before they are counted, and `grep -c .` rather than `wc -l`,
          # which counts the single empty line an empty variable prints as one model (M1 PR 13).
          models=$(head -1 -q report/*.txt | sed '/^[[:space:]]*$/d' | sort -u)
          count=$(printf '%s\n' "$models" | grep -c . || true)
          echo "CPU models seen: $count"
          printf '%s\n' "$models"
          if [ "$count" -eq 0 ]; then
            echo "::error::no runner reported a CPU model; the cpu step should have failed before this"
            exit 1
          fi
          if [ "$count" -ge 2 ]; then
            echo "::notice::ADR 0009 §6: identical PCM on $count different CPU models"
          else
            echo "::warning::ADR 0009 §6 is inconclusive this run: every runner was the same CPU model, so the agreement says nothing about cross-CPU. The claim stays where ADR 0009 §1 puts it."
          fi
