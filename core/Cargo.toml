[package]
name = "escribass-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Song model core: canonical persistence, validation, patch log"

[dependencies]
escribass-schema = { path = "../schema" }
# The tool API's wire types. `core` implements the service; the transports only translate.
escribass-proto = { path = "../proto" }
# Decoding the descriptor set into tool schemas (ADR 0006 §6).
prost = "0.14"
# The MCP server (§18.2, ADR 0006 §6). `server` brings the handler traits, `transport-io`
# the stdio transport. `macros` is off: the `#[tool]` macro derives schemas from Rust types
# with schemars, and ours come from the protobuf descriptor.
# The gRPC surface (§5). `tonic-prost` is the codec the generated service uses.
tonic = "0.14.6"
tonic-prost = "0.14.6"
rmcp = { version = "3.2.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "time"] }
# Already in the lock via escribass-schema and pinned in lock.baseline.json as
# schema.rust.serde; declared here for the Op derive.
serde = { version = "1", features = ["derive"] }
# float_roundtrip: without it the parser is off by one ULP on ~30% of doubles, so
# load-then-save is not a fixed point (ADR 0002 §4).
serde_json = { version = "1", features = ["float_roundtrip"] }
