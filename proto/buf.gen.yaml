version: v2
inputs:
  - directory: .
plugins:
  # Rust first, then TypeScript (M2 PR 3) and Python (M3 PR 3) — ADR 0006 §7's "Rust now;
  # TypeScript at M2; Python at M3", each landing in the milestone that gave it a consumer.
  # The service's Python is a *server* and no client, because `ai` serves and dials nothing
  # (ADR 0020 §1); the plugin entry at the bottom of this file says the rest.
  - local: protoc-gen-prost
    out: gen/rust
    opt:
      - btree_map=.
      - compile_well_known_types
      - extern_path=.google.protobuf=::pbjson_types
      # Without these two the generated code would name song and history types by a relative
      # `super::super::` path, assuming they live in this crate — and any attempt to fix that
      # by generating them here would put a second `Song` in the tree (CLAUDE.md #1).
      - extern_path=.escribass.song.v1=::escribass_schema::song
      - extern_path=.escribass.history.v1=::escribass_schema::history
  - local: protoc-gen-prost-serde
    out: gen/rust
    opt:
      - btree_map=.
      - emit_fields
      - preserve_proto_field_names
      - extern_path=.google.protobuf=::pbjson_types
      - extern_path=.escribass.song.v1=::escribass_schema::song
      - extern_path=.escribass.history.v1=::escribass_schema::history
  # The tonic service traits and client. Same extern_path set as above, or the generated code
  # would name the model types by a relative path into this crate.
  #
  # The client is generated as well as the server: `core`'s own tests are its first consumer —
  # an end-to-end test needs something to call with — and M2's app is the next. Hand-rolling
  # one for the test would be strictly more code than generating it.
  - local: protoc-gen-tonic
    out: gen/rust
    opt:
      # No `btree_map` here: this plugin generates service traits, not messages, and rejects
      # the option. Map ordering is prost's business and is set above.
      - compile_well_known_types
      - extern_path=.google.protobuf=::pbjson_types
      - extern_path=.escribass.song.v1=::escribass_schema::song
      - extern_path=.escribass.history.v1=::escribass_schema::history
  # TypeScript, for `app` (ADR 0006 §7, which deferred it until a consumer existed; M2 PR 2 is
  # the consumer). Messages, enums and service *descriptors* — protoc-gen-es generates no
  # client, and `app` needs none: it reaches the tool API through one Tauri command into the
  # `core` linked beside it, not over a port (ADR 0012 §1). Nothing consumes the `Assistant`
  # types it now writes either: `app` reaches the sidecar through `core` too.
  - local: protoc-gen-es
    out: gen/ts
    opt:
      - target=ts
      # NodeNext resolution requires explicit extensions on relative imports, as in schema/.
      - import_extension=js
      # The TypeScript spelling of the four `extern_path` lines above, and it exists for the
      # same reason. Without it the generated code imports `./song_pb.js` and
      # `./history_pb.js` — files this module does not generate and must not, because
      # generating them would put a second `Song` in the tree (CLAUDE.md #1). The rewrite
      # sends them to the package that does generate them; the `_pb.js` names are what
      # `@escribass/schema`'s exports map answers to for exactly this.
      - rewrite_imports=./song_pb.js:@escribass/schema
      - rewrite_imports=./history_pb.js:@escribass/schema
  # Python, for `ai` (ADR 0006 §7, carried out and narrowed by ADR 0020 §1). The sidecar
  # **serves** `Assistant` and dials nothing, so a server and no client — and the reason the
  # direction was decided that way is this plugin: `client_generation=async,
  # server_generation=async` emits a grpclib client *and* server, the defaults emit a
  # synchronous grpcio client and no server, and there is no grpcio server option at all
  # (ADR 0020 §2). The `SongTools` and `Preview` servers this same run generates have no
  # consumer and are left unused rather than excluded, since a per-file plugin configuration
  # is a second thing to keep in step.
  #
  # `uv run --project ../schema` because the compiler is pinned in schema/'s environment and
  # this module has no Python environment of its own — the same borrowing as `protoc-gen-es`
  # and `tsc` above.
  #
  # This plugin has no `extern_path` and no `rewrite_imports`: it generates a module for
  # **every** file in the request, imports included, so this run re-emits song.proto and
  # history.proto beside the service — a second `Song` in the tree, which is what the four
  # `extern_path` lines and the two `rewrite_imports` above exist to prevent (CLAUDE.md #1,
  # ADR 0006 §4). codegen.sh deletes the copy and sends those imports to `escribass_schema`,
  # and fails the run if it cannot (ADR 0020 §1, amended 2026-09-22).
  - local: [uv, run, --project, ../schema, protoc-gen-python_betterproto2]
    out: gen/python/escribass_proto
    opt:
      # Constructors validate; from_json() does not — the trap schema/tests names, and this
      # is the same runtime.
      - pydantic_dataclasses
      - client_generation=none
      - server_generation=async
