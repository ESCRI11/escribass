// The tool API (docs/specs.md §5). See docs/adr/0006-tool-api-wire-shape.md for the choices
// this file makes that §5 leaves open.
//
// Every mutation in the system arrives here. Agents never read or write the project file
// directly (§5), so this service is the whole of what can be done to a song.
//
// Three rules shape the file, all from ADR 0006:
//
//   1. Every mutating RPC returns ToolResult. One contract, not sixteen copies of one.
//      Reads return what they read; `valid` and `patch` mean nothing for them.
//   2. Requests embed escribass.song.v1 entity messages wherever a whole entity is meant.
//      A hand-written NoteSpec mirroring Note is a second representation of song state
//      (CLAUDE.md #1) under another name, and it stops matching the first time a field is
//      added to song.proto.
//   3. Errors are Violation, the same path/rule/message shape core already returns. An
//      invalid call comes back as ToolResult.valid = false, never as a transport failure:
//      §6's retry loop has to be able to see it.
//
// buf lint STANDARD is relaxed for this module in the root buf.yaml — SERVICE_SUFFIX,
// RPC_RESPONSE_STANDARD_NAME and RPC_REQUEST_RESPONSE_UNIQUE all contradict rule 1, and
// rule 1 is §5's specified shape.

syntax = "proto3";

package escribass.tools.v1;

import "history.proto";
import "render.proto";
import "song.proto";

// ---------------------------------------------------------------------------
// The result contract (ADR 0006 §1, §2)
// ---------------------------------------------------------------------------

// The wire form of core's Violation, PatchError, HistoryError and ProjectError, which all
// carry these three fields already. Not a fifth error type — the transport of the first.
message Violation {
  // RFC 6901 pointer into the canonical JSON, or the file the failure concerns.
  string path = 1;
  // Stable machine-readable rule id, e.g. "pitch_out_of_range". Callers match on this.
  string rule = 2;
  string message = 3;
}

// What every mutating tool returns, applied or not (§5).
message ToolResult {
  // False means the call was refused. Nothing was written and `errors` says why.
  bool valid = 1;

  // Every violation, not the first: §6 allows three retries and a model fixing one problem
  // at a time wastes them.
  repeated Violation errors = 2;

  // The canonical RFC 6902 text of the patch this call produces — the re-derived diff,
  // including the version bumps of ADR 0005, so a dry run shows exactly what a commit would
  // record. Bytes, not a struct: modelling RFC 6902 values in protobuf made the patch log
  // nondeterministic (ADR 0002 §11). Empty when `valid` is false.
  bytes patch = 3;

  // One deterministic line describing the patch. Generated from the diff, never per-tool
  // prose, so two identical calls produce identical bytes (§11).
  string summary = 4;

  // The id of the entry that was appended. Empty on a dry run, and empty when invalid.
  string entry_id = 5;
}

// ---------------------------------------------------------------------------
// Reads (ADR 0006 §1)
// ---------------------------------------------------------------------------

// The song as it stands on the current branch.
message GetSongRequest {}

// The song as it stood at one entry in the log, rebuilt by replay (ADR 0001 §2).
message GetSongAtRequest {
  // A patch entry id. Materialised by replaying the log to that entry (ADR 0001 §2).
  string entry_id = 1;
}

message SongResponse {
  escribass.song.v1.Song song = 1;
}

// The whole patch log and the refs that name positions in it.
message GetHistoryRequest {}

message HistoryResponse {
  // Every entry in the log, keyed by id. A map, like every other collection, so a caller
  // patches by id rather than by position (ADR 0001 §3).
  map<string, escribass.history.v1.PatchEntry> entries = 1;
  escribass.history.v1.Refs refs = 2;
}

// ---------------------------------------------------------------------------
// The raw pipeline
// ---------------------------------------------------------------------------

// Apply an RFC 6902 patch directly. The typed tools below are the supported surface; this
// exists because M0.4 must drive core through the tool API rather than the file
// (CLAUDE.md #2), and because §9 lets a user edit a proposed diff before applying it.
//
// An op writing an entity's `version` is refused: core maintains it (ADR 0005 §3).
message ApplyPatchRequest {
  // Canonical RFC 6902 text, the same form ToolResult.patch returns.
  bytes patch = 1;
  bool dry_run = 2;
}

// ---------------------------------------------------------------------------
// Tracks and devices (§5)
// ---------------------------------------------------------------------------

// Adds a track. `index` is assigned after the current last; the master track already exists
// in every song (§4.4).
//
// `ref` is required when `kind` is TRACK_KIND_INSTRUMENT and refused otherwise: ADR 0002
// requires an instrument present exactly when the track is one, so an instrument track cannot
// be created empty and filled in afterwards — there is no valid song in between.
message AddTrackRequest {
  string name = 1;
  escribass.song.v1.TrackKind kind = 2;
  optional escribass.song.v1.DeviceRef ref = 4;
  bool dry_run = 3;
}

// Sets the instrument on an instrument track. Replaces whatever was there.
message SetTrackInstrumentRequest {
  string track_id = 1;
  // The device is identified by which case is set; there is no separate kind (ADR 0002 §3).
  escribass.song.v1.DeviceRef ref = 2;
  bool dry_run = 3;
}

// Adds an effect to a track's chain.
message AddEffectRequest {
  string track_id = 1;
  escribass.song.v1.DeviceRef ref = 2;
  // Position in the chain. Absent appends after the current last.
  optional uint32 index = 3;
  bool dry_run = 4;
}

// Sets one parameter on an instrument or effect.
message SetParamRequest {
  // An Instrument or Effect id. Ids are globally unique, so no track id is needed
  // (song.proto, ParamRef).
  string device_id = 1;
  string param = 2;
  double value = 3;
  bool dry_run = 4;
}

// ---------------------------------------------------------------------------
// Clips, notes and automation (§5)
// ---------------------------------------------------------------------------

// Adds a clip to a track.
message AddClipRequest {
  string track_id = 1;
  int32 start_tick = 2;
  int32 length_ticks = 3;
  // Which kind of clip. Absent content makes an empty note clip.
  oneof content {
    escribass.song.v1.NoteClip note_clip = 4;
    escribass.song.v1.AudioClip audio_clip = 5;
  }
  bool dry_run = 6;
}

// Replaces the clip's whole note set. A note carrying an id that already exists in this clip
// keeps it; every other note is minted a new one.
message SetNotesRequest {
  string clip_id = 1;
  map<string, escribass.song.v1.Note> notes = 2;
  bool dry_run = 3;
}

// Adds `semitones` to each note's pitch. A result outside MIDI 0-127 is refused, never
// clamped: silently rewriting a caller's request is how a tool stops being predictable.
message TransposeRequest {
  string clip_id = 1;
  int32 semitones = 2;
  // Empty means every note in the clip.
  repeated string note_ids = 3;
  bool dry_run = 4;
}

// Snaps each note's start_tick to the nearest multiple of grid_ticks. Integer arithmetic
// throughout, with a fixed tie rule, so the result cannot vary by platform (§11).
message QuantizeRequest {
  string clip_id = 1;
  int32 grid_ticks = 2;
  repeated string note_ids = 3;
  bool dry_run = 4;
}

// Adds an automation lane for one device parameter, with its points.
message AddAutomationRequest {
  escribass.song.v1.ParamRef target = 1;
  map<string, escribass.song.v1.AutomationPoint> points = 2;
  bool dry_run = 3;
}

// ---------------------------------------------------------------------------
// Assets (§10)
// ---------------------------------------------------------------------------

// Puts a file in assets/, named by its SHA-256, and returns that name — the value an
// AudioClip.asset_hash then references. Content-addressed, so adding the same bytes twice
// writes one file and the call is safe to repeat.
//
// The bytes are opaque: §10's assets/ holds samples, compiled plugins and models alike, and
// core inspects none of them. Over MCP they cross as proto3 JSON's base64 — the same rule as
// Instrument.state, and unlike ToolResult.patch, which is JSON text wearing a bytes field
// (ADR 0006 §6). Whether an asset is something the engine can play is the engine's question,
// asked when it opens the file.
//
// dry_run returns the hash and writes nothing: the first half of the real path, as for every
// tool (ADR 0006 §3).
//
// ponytail: an asset is bounded by each transport's default message limit (4 MB over gRPC).
// Raise them, or take a path, when a real asset exceeds it.
message AddAssetRequest {
  bytes content = 1;
  bool dry_run = 2;
}

// What add_asset returns. Not ToolResult: that message is for tools that produce ops, which
// the pipeline records or refuses, and an asset is neither in the song nor in the log —
// there is no patch and no entry, and the one thing the caller needs is the address. The
// reads set the precedent for a tool returning what it produced (ADR 0006 §1). Nor is there
// a caller-fixable half to carry: core refuses no content, so the only failure is an
// unwritable directory, which is an operator's (ADR 0006 §2).
message AssetResponse {
  string asset_hash = 1;
}

// ---------------------------------------------------------------------------
// Time base and arrangement (§5)
// ---------------------------------------------------------------------------

// Upserts the tempo event at `tick`. The map must keep an event at tick 0 (§4.4).
message SetTempoRequest {
  double bpm = 1;
  int32 tick = 2;
  bool dry_run = 3;
}

// Adds a named section over a range of ticks. Sections label time; they contain nothing.
message AddSectionRequest {
  string name = 1;
  int32 start_tick = 2;
  int32 end_tick = 3;
  bool dry_run = 4;
}

// Moves a section's bounds. Its clips do not move: §4.2 makes a section a label over a time
// range, not a container.
message MoveSectionRequest {
  string section_id = 1;
  int32 start_tick = 2;
  int32 end_tick = 3;
  bool dry_run = 4;
}

// ---------------------------------------------------------------------------
// Rendering (§8)
// ---------------------------------------------------------------------------

// Renders the song as it stands to a WAV at `output_path`. Core compiles the document into a
// RenderPlan (ADR 0007 §4) and hands it to a fresh engine process, which writes the file and
// exits (ADR 0008 §2).
//
// `valid` and `errors` are the caller's half: what this engine cannot render comes back as
// render_unsupported, naming the field (ADR 0007 §6). An engine that will not start, crashes
// or writes nothing is an operator error and never a refusal, since no retry fixes a crash
// (ADR 0008 §1).
//
// dry_run compiles and reports, and spawns no engine: compile is the first half of a render,
// exactly as prepare is the first half of a commit (ADR 0006 §3).
message RenderExportRequest {
  // Absolute path of the WAV to write. The engine is handed this and the plan, nothing else.
  // A relative one is refused rather than resolved against whatever directory this process
  // happens to be in.
  string output_path = 1;
  bool dry_run = 2;
}

// What render_export returns. **Not ToolResult, revised 2026-09-07 in M1 PR 10** — it was
// declared as one when this RPC was defined in PR 3, before the engine existed to answer.
//
// Two halves of the same reason. Nothing here is a mutation: `patch` and `entry_id` would be
// permanently empty, and ADR 0006 §1 gives the shared result to the tools that produce ops
// for the pipeline to record or refuse, not to a tool whose fields are mostly inapplicable.
// And a render's own answer — the hash of what it produced, and the commits of the build that
// produced it — has nowhere to go in ToolResult, so a caller driving this over MCP could not
// see either, while §18.2 publishes the first and ADR 0008 §5 has the render suite compare
// the second before it compares a sample. AddAsset set the precedent one section up: a tool
// that produces an artefact answers with the artefact's address, and a render's address is
// its hash.
message RenderResponse {
  // False means nothing was rendered and `errors` says why (ADR 0006 §2).
  bool valid = 1;
  repeated Violation errors = 2;

  // One deterministic line describing the render: its length and what plays. Derived from the
  // plan, never from the caller's arguments, so it carries no path (§11).
  string summary = 3;

  // The engine's own answer, by value rather than copied field by field — a field added to
  // RenderResult reaches a caller without touching this file (ADR 0006 §4, one boundary
  // over). Absent on a dry run and on a refusal: no engine ran.
  escribass.render.v1.RenderResult result = 4;
}

// ---------------------------------------------------------------------------
// Undo and redo (ADR 0005 §4)
// ---------------------------------------------------------------------------

// Reverses the last change by **appending its inverse**, never by rewinding a ref: a rewind
// decrements entity `version`, and §4.3's optimistic concurrency needs it monotonic
// (ADR 0005 §4). So an undo is a thing that happened rather than a thing that unhappened,
// and it appears in the audit trail §5 asks for like any other entry.
//
// The session holds the entries it has undone. A second call therefore walks one further
// back rather than undoing the undo, and any other commit clears that list — which is the
// model every editor already implements. It is per session and per process: a session that
// has just opened has undone nothing, so its first call reverses whatever the log ends with.
message UndoRequest {
  bool dry_run = 1;
}

// Re-applies the change the last `undo` reversed, by the same mechanism and with the same
// guarantee. Refused with `nothing_to_redo` when this session has undone nothing.
message RedoRequest {
  bool dry_run = 1;
}

// ---------------------------------------------------------------------------
// Branches (ADR 0001 §2, §4)
// ---------------------------------------------------------------------------

// Names a new position in the log. Branching copies no data (ADR 0001 §2).
message CreateBranchRequest {
  // ASCII [a-z0-9._/-], no leading or trailing slash, no `..` segment (ADR 0001 §2).
  string name = 1;
  // The entry to branch from. Empty means the current HEAD.
  string at_entry_id = 2;
  bool dry_run = 3;
}

// Moves HEAD. Appends nothing: history that recorded navigation would grow every time
// somebody looked at a branch (ADR 0001 §2).
message SwitchBranchRequest {
  string name = 1;
  bool dry_run = 2;
}

// Discards the name. The entries stay in the log, unreferenced and inert (ADR 0001 §2).
message DeleteBranchRequest {
  string name = 1;
  bool dry_run = 2;
}

// Merges `name` into the current branch, appending one entry with two parents. Disjoint
// paths auto-resolve; the same path is a conflict returned in ToolResult.errors, never
// resolved by a rule nobody chose (ADR 0001 §4).
message MergeBranchRequest {
  string name = 1;
  bool dry_run = 2;
}

// ---------------------------------------------------------------------------
// The service (§5)
// ---------------------------------------------------------------------------

// The project is named when the process starts, not per call: an MCP stdio process is not a
// session, and two writers on one .escri would race the write ordering ADR 0004 depends on
// (ADR 0006 §5).
service SongTools {
  rpc GetSong(GetSongRequest) returns (SongResponse);
  rpc GetSongAt(GetSongAtRequest) returns (SongResponse);
  rpc GetHistory(GetHistoryRequest) returns (HistoryResponse);

  rpc ApplyPatch(ApplyPatchRequest) returns (ToolResult);

  rpc AddTrack(AddTrackRequest) returns (ToolResult);
  rpc SetTrackInstrument(SetTrackInstrumentRequest) returns (ToolResult);
  rpc AddEffect(AddEffectRequest) returns (ToolResult);
  rpc SetParam(SetParamRequest) returns (ToolResult);

  rpc AddClip(AddClipRequest) returns (ToolResult);
  rpc SetNotes(SetNotesRequest) returns (ToolResult);
  rpc Transpose(TransposeRequest) returns (ToolResult);
  rpc Quantize(QuantizeRequest) returns (ToolResult);
  rpc AddAutomation(AddAutomationRequest) returns (ToolResult);

  rpc AddAsset(AddAssetRequest) returns (AssetResponse);

  rpc SetTempo(SetTempoRequest) returns (ToolResult);
  rpc AddSection(AddSectionRequest) returns (ToolResult);
  rpc MoveSection(MoveSectionRequest) returns (ToolResult);

  rpc RenderExport(RenderExportRequest) returns (RenderResponse);

  rpc Undo(UndoRequest) returns (ToolResult);
  rpc Redo(RedoRequest) returns (ToolResult);

  rpc CreateBranch(CreateBranchRequest) returns (ToolResult);
  rpc SwitchBranch(SwitchBranchRequest) returns (ToolResult);
  rpc DeleteBranch(DeleteBranchRequest) returns (ToolResult);
  rpc MergeBranch(MergeBranchRequest) returns (ToolResult);

  // set_form (§5) waits for FormRule (M4, ADR 0002 §7); define_generator,
  // compile_generator, define_instrument_source and compile_instrument wait for the
  // compilers (M4); render_preview waits for M2's live engine process (ADR 0008 §2).
  // ADR 0003.
}
