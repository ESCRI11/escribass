// What crosses into the engine, and what comes back (docs/specs.md §8). The choices this
// file makes that §8 leaves open: docs/adr/0007-engine-renders-a-render-plan.md (what a plan
// is), 0008 (how it travels, and what the engine reports), 0009 §2 (what the hash is of).
//
// The engine never receives a Song. It receives a RenderPlan: flat, ordered, already
// resolved. Nothing that needs the model's structure crosses — no id-keyed map, no
// Clip.track_id, no Mix.solo to resolve against other tracks, no loop_length_ticks to expand,
// no Effect.index to sort by, no history field. Core does all of that once, in compile, and
// the engine renders exactly length_ticks ticks with no opinion of its own (ADR 0007 §1).
//
// Two rules decide every message here (ADR 0007 §2):
//
//   1. A song.v1 message is reused **by value** when it holds no entity collection and no id
//      naming another entity. Its id, provenance and version cross empty. A plan-local copy
//      would be the mirrored shape ADR 0006 §4 forbids: a field added to Note would never
//      reach it, and nothing would break loudly enough to notice.
//   2. Everything structural — the track list, a clip list, an effect chain, a lane's points,
//      the tempo map — is plan-local and `repeated`, never a map. ADR 0001 §3 keys the model
//      by id so patch paths survive concurrent inserts; a plan is never patched, and
//      `repeated` carries the one thing the model deliberately does not store: order.
//
// A Plan* message holds no field the model already has, apart from the two ints a clip
// cannot cross without (Clip carries a track_id, so it cannot be reused whole). The
// descriptor-driven test of ADR 0007 §5 is what keeps that true.
//
// The plan is derived, never persisted, never edited, never read back. It has the standing
// of a WAV, not of song.json, so it is not a second representation of song state
// (CLAUDE.md #1, ADR 0007 §5).
//
// The preview messages at the bottom carry that same plan and add no artefact beside it
// (ADR 0013 §2), so the two rules above decide those as well and are not restated there.

syntax = "proto3";

package escribass.render.v1;

import "song.proto";

// ---------------------------------------------------------------------------
// The plan (ADR 0007)
// ---------------------------------------------------------------------------

// One offline render. Exactly one of these crosses on one Render.Render call, to a process
// spawned for it that answers with one RenderResult and exits (ADR 0008 §1, §2; ADR 0013 §3).
// The same message is also, inside a PreviewPlay, the argument of a preview — which is this
// played from a tick rather than written to a file.
message RenderPlan {
  // Every track that sounds, in mixer order. Tracks that solo and mute silence are already
  // gone, and every one of these outputs to `master`: sends, sidechains and buses are M2's,
  // and compile refuses them with render_unsupported (ADR 0007 §6).
  repeated PlanTrack tracks = 1;

  // The master track: its effect chain and its mix. Structural rather than a kind on
  // PlanTrack, because Track.kind is consumed by compile, not carried (ADR 0007 §5).
  PlanTrack master = 2;

  // The tempo map, in tick order. Every tick in this plan is a model tick at 960 PPQ, and
  // the engine places it on its own tempo sequence: one owner of tick→sample is one fewer
  // rounding site (ADR 0007 §3). If that proves unstable across tempo changes, the recorded
  // fallback is core-computed sample positions beside the ticks, in a later field.
  repeated escribass.song.v1.TempoEvent tempo = 3;

  escribass.song.v1.RenderTarget target = 4;

  // How long the render is: the end of the last clip or of the last section, whichever is
  // later (docs/plan.md, decisions of 2026-09-04). A section that outlasts every clip is an
  // outro someone named, and it renders as the silence they wrote. The engine renders this
  // many ticks and stops; it looks for neither itself.
  int32 length_ticks = 5;

  // Where the WAV goes, absolute. A path the engine is handed is output, not a project file;
  // §8's "never reads project files" is about the .escri, not the filesystem (ADR 0008 §1).
  // Empty in a PreviewPlay, which writes no file — the check that it is absolute is the
  // export's alone (M2 PR 10).
  string output_path = 6;
}

// A track as the engine builds it: devices in order, then what plays through them.
message PlanTrack {
  // Absent on an audio track and on master (§4.4).
  PlanInstrument instrument = 1;

  // The effect chain in chain order — Effect.index sorted by compile, not by the engine
  // (ADR 0007 §1).
  repeated PlanEffect effects = 2;

  escribass.song.v1.Mix mix = 3;

  // In timeline order. Loops are already expanded: a looping clip arrives as its unrolled
  // content, and no clip here carries a loop length.
  repeated PlanClip clips = 4;

  // Automation of the fader and the pan the `mix` above holds still. A lane's `param` is
  // `gain_db` or `pan` — the two names a ParamRef may carry when its device_id resolves to a
  // track, and the only two, because a double automating a bool would need a threshold rule
  // that is ours and pinned (ADR 0015 §1).
  //
  // Its points are in the **model's** units: decibels, unbounded, and -1..1. That is the one
  // place the plan's parameter values are not the normalised 0..1 a plugin exposes, and the
  // asymmetry is the honest one — there is no plugin behind a Mix field to normalise against,
  // and inventing a normalisation means choosing a maximum gain the model does not have
  // (ADR 0015 §2, amending ADR 0010 §4).
  //
  // Nested here rather than naming the track, for the reason PlanInstrument.lanes is nested:
  // a name in the plan is an id crossing the boundary, which is what rule 1 keeps out.
  //
  // ponytail: always empty until M2 PR 6. `compile` cannot produce one yet, because the
  // validator still refuses a ParamRef whose device_id names a track — so the field is here
  // to be guarded by buf breaking once, with Preview, rather than to be filled (docs/plan.md,
  // M2 trap 12). The upgrade path is PR 6: one arm in validate.rs, one in compile.
  repeated PlanLane mix_lanes = 5;
}

// An instrument with the automation that targets it. Lanes nest under their device rather
// than naming it: ParamRef.device_id is an id naming another entity, which is exactly what
// rule 1 keeps out of the plan, and a positional index would be an Effect.index by another
// name.
message PlanInstrument {
  escribass.song.v1.Instrument instrument = 1;
  repeated PlanLane lanes = 2;

  // Absolute path of the SFZ file, resolved by core from `SamplerRef.sfz_hash` (§10), and
  // empty for every other device kind. The same shape as `PlanAudio.path`, for the same
  // reason: an asset crosses as a path the engine is handed, never as bytes in the plan
  // (ADR 0007 §2, extended 2026-09-07).
  //
  // ponytail: what M1 renders is an SFZ whose `sample=` opcodes name assets in the SFZ's own
  // directory. `assets/` is flat and content-addressed, so an SFZ stored there resolves a
  // sibling by its hash — and a `sample=` written as a relative path into a sample library
  // resolves to nothing. The engine refuses one it cannot resolve rather than rendering the
  // silence sfizz would; carrying a whole sample library needs an asset that knows its own
  // name, which no ADR has decided.
  string sfz_path = 3;
}

message PlanEffect {
  escribass.song.v1.Effect effect = 1;
  repeated PlanLane lanes = 2;
}

// One automated parameter of the enclosing device — or, under PlanTrack.mix_lanes, of the
// track itself.
message PlanLane {
  // ParamRef.param: the identifier the plugin itself declares (ADR 0010 §4), or `gain_db` or
  // `pan` where the lane is a mix lane (ADR 0015 §1). Which of the two a point's value means
  // follows from where the lane is nested, never from a field naming it.
  string param = 1;

  // In tick order. The curve on each point is one of the two shapes ADR 0002 §8 defines a
  // formula for; the engine implements those formulas, not Tracktion's own.
  repeated escribass.song.v1.AutomationPoint points = 2;
}

// A clip placed on the timeline. start_tick and length_ticks are Clip's own, copied because
// Clip carries a track_id and cannot cross whole; nothing else of Clip is here.
message PlanClip {
  int32 start_tick = 1;
  int32 length_ticks = 2;

  oneof content {
    PlanNotes notes = 3;
    PlanAudio audio = 4;
  }
}

// The notes of a clip, by value, in start order. Note.start_tick stays clip-relative, as the
// model holds it (ADR 0007 §3).
message PlanNotes {
  repeated escribass.song.v1.Note notes = 1;
}

// An audio clip beside the file it plays. The bytes are not embedded: every sample of every
// asset across the wire and into the plan golden is the alternative ADR 0007 §2 rejects. The
// engine learns nothing about the .escri from a path it opens.
//
// ponytail: a looped, stretched clip whose length is not a multiple of its loop is not yet
// expressible — compile expands the loop, and the truncated last iteration would stretch to
// the wrong length (ADR 0011 §3). compile refuses one with render_unsupported rather than
// hand the engine a plan that is wrong by construction (ADR 0007 §6, amended). One additive
// field naming the stretched unit lifts the refusal; no ADR names it yet.
message PlanAudio {
  escribass.song.v1.AudioClip clip = 1;

  // Absolute path of the asset, resolved by core from AudioClip.asset_hash (§10).
  string path = 2;
}

// ---------------------------------------------------------------------------
// The result (ADR 0008 §5, ADR 0009 §2)
// ---------------------------------------------------------------------------

// What a successful render reports. Failure is an exit code, never a result carrying errors:
// by the time a plan reaches the engine every caller-fixable failure has already been
// refused upstream, and no retry fixes a crash (ADR 0008 §1).
message RenderResult {
  // SHA-256, lowercase hex, of the WAV's `data` chunk — the PCM payload and only that.
  // Never of the file: JUCE writes a `bext` chunk carrying the clock, so the file differs
  // between two runs that produced identical audio (ADR 0009 §2). This is the number the
  // committed .sha256 beside a golden holds and the one §18.2 publishes.
  string pcm_sha256 = 1;

  // The commit each vendored component was compiled from, keyed by its name in
  // lock.baseline.json — tracktion_engine, juce, rubberband, and each bundled plugin —
  // embedded at configure time from the submodule checkout, never read from a file at run
  // time. The render suite compares these before it compares a sample (ADR 0008 §5).
  map<string, string> commits = 2;
}

// ---------------------------------------------------------------------------
// Preview (ADR 0013 §2)
// ---------------------------------------------------------------------------

// A preview is not a second artefact. It is the RenderPlan above, played from a tick instead
// of written to a file — so everything the two rules at the top of this file decided about a
// plan is already decided for a preview, and none of it is decided twice (ADR 0013 §2).

// The plan to play, and where the transport starts in it.
//
// Also how a plan is *replaced*: ADR 0013 §2 replaces, never diffs, so a note drag recompiles
// the whole plan and sends it again with the tick playback has reached. A plan diff would be a
// second RFC 6902 for a document that is not the model, applied in C++ where the validator
// does not run — which is the shape ADR 0007 §5's coverage test exists to keep out.
//
// A plan equal to the one already playing is not built again: the transport moves to
// `start_tick` and plays, and the plugin instances stay where they are, which is what
// `PreviewStop` keeps them for (M2 PR 10).
message PreviewPlay {
  RenderPlan plan = 1;
  int32 start_tick = 2;
}

// Move the transport, leaving the plan where it is.
message PreviewSeek {
  int32 tick = 1;
}

// The loop range, in the same model ticks the plan is in. An empty range — `end_tick` at or
// before `start_tick` — clears the loop, so there is neither a second command nor an
// `optional` to carry the absence of one.
message PreviewLoop {
  int32 start_tick = 1;
  int32 end_tick = 2;
}

// Stop the transport without ending the session: the plan stays loaded and its plugins stay
// instantiated, which is the only reason a preview process is live at all (ADR 0013 §3).
// Ending the preview is closing the stream, which the operating system does for free when
// `app` dies.
//
// Empty, and its own message rather than google.protobuf.Empty, because an arm of a oneof
// that may need a field later cannot grow one if it is the well-known empty.
message PreviewStop {}

// One command from `app` to a live engine.
//
// The stream is the session. Four unary calls would each need to say which preview they meant,
// and inventing that handle is the surface ADR 0006 §5 declined to invent for projects
// (ADR 0013 §2).
message PreviewCommand {
  oneof command {
    PreviewPlay play = 1;
    PreviewSeek seek = 2;
    PreviewLoop loop = 3;
    PreviewStop stop = 4;
  }
}

enum PreviewState {
  PREVIEW_STATE_UNSPECIFIED = 0;
  PREVIEW_STATE_PLAYING = 1;
  PREVIEW_STATE_STOPPED = 2;
}

// Where the transport is and what it is doing.
//
// There is no error arm, for the reason RenderResult carries no errors: by the time a plan
// reaches the engine every caller-fixable failure has been refused upstream, and what is left
// ends the stream with a gRPC status rather than travelling as a value someone may forget to
// read (ADR 0008 §1).
//
// Two kinds of event share this message: the one answering each command, written once the
// engine has applied it, and the ones the transport writes of its own accord while it plays —
// the tick moving, and the stop at the end of the plan (ADR 0013 §2, amended 2026-09-15).
message PreviewEvent {
  // The model tick the transport is at, floored, on the plan's own tempo map.
  int32 tick = 1;
  PreviewState state = 2;

  // How many commands this stream had applied when the event was written.
  //
  // What lets a caller tell the answer to its n-th command from an event the transport wrote
  // on its own: wait for `applied == n`. Order alone cannot say it, because an event the
  // transport writes while a command is still on the wire arrives after that command was sent
  // and before it was applied. Added in M2 PR 10, where the first caller had to wait on one
  // (ADR 0013 §2, amended 2026-09-15).
  int32 applied = 3;
}

// ---------------------------------------------------------------------------
// The services (ADR 0008 §1, ADR 0013 §3)
// ---------------------------------------------------------------------------
//
// Two services, not one with two RPCs, because ADR 0013 §3 makes the engine's mode *which
// service the process serves*. A process spawned to export registers Render and nothing else,
// so a Preview call on it is refused by gRPC rather than by a check someone remembered to
// write — which is how ADR 0008 §2's guarantee stays enforced rather than maintained by
// discipline in C++: an export never shares a plugin instance with something played before it.

// Defined in M1 so buf breaking guards the shape M2 implements, and implemented at M2 (PR 9).
// M1's engine spoke these same two messages over stdio, one each way, delimited by end of
// stream; that path was deleted in the pull request that served this one rather than kept
// beside it, because two transports for one boundary is one tested transport and one that is
// not (ADR 0008 §1). The engine names its own socket and prints it, so what a caller is told
// is where to dial and that it may (ADR 0013 §3, amended).
service Render {
  // One offline render of one plan to the file the plan names.
  rpc Render(RenderPlan) returns (RenderResult);
}

// Defined in M2 PR 3 and implemented in PR 10, for the reason Render was defined a milestone
// before anything served it: buf breaking runs on pull requests only, so a service that grows
// across two of them is compared against a main that has already moved (docs/plan.md, M2
// trap 12). PR 10 added one field, `PreviewEvent.applied`, which is additive and is the one
// thing the shape could not have been settled without a caller to wait on an answer.
service Preview {
  // One preview session, for as long as the stream is open. Closing it stops playback, and
  // `app` dying closes it for free (ADR 0013 §2).
  rpc Preview(stream PreviewCommand) returns (stream PreviewEvent);
}
