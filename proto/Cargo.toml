[package]
name = "escribass-proto"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Generated Rust types for the escribass tool API (SongTools)"

[dependencies]
# The service references the model rather than restating it: every entity type in a request
# is the one from song.proto, reached through extern_path (ADR 0006 §4).
escribass-schema = { path = "../schema" }
prost = "0.14"
# Decodes gen/descriptor.binpb, which the MCP server turns into tool schemas (ADR 0006 §6).
prost-types = "0.14"
# The generated service traits (gen/rust/*.tonic.rs). Pinned to the line that pairs with
# prost 0.14: tonic 0.13 pairs with prost 0.13 and would put a second `prost::Message` in the
# tree, which the generated `Song` would not satisfy (ADR 0006).
tonic = "0.14.6"
tonic-prost = "0.14.6"
pbjson = "0.8"
pbjson-types = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
